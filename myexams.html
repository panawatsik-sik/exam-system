<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชุดสอบของฉัน | ระบบสอบออนไลน์</title>
<style>
  :root{--ink:#1a2e22;--paper:#f6f4ec;--card:#fff;--leaf:#2f7d4f;--leaf-dark:#235d3b;
    --leaf-soft:#e5f0e8;--clay:#c65d3b;--amber:#d99a2b;--line:#d8d4c4;--muted:#6b7566;
    --shadow:0 2px 8px rgba(30,50,35,.08);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;padding:20px 16px 60px;}
  .wrap{max-width:860px;margin:0 auto;}
  .band{background:linear-gradient(160deg,var(--leaf) 0%,var(--leaf-dark) 100%);color:#fff;
    border-radius:16px;padding:24px 22px;margin-bottom:20px;box-shadow:var(--shadow);}
  .band h1{font-size:22px;font-weight:700;} .band p{font-size:13.5px;opacity:.9;margin-top:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card h2{font-size:17px;margin-bottom:12px;}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;}
  input[type=password],input[type=text]{width:100%;font-size:15px;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:10px;background:#fbfaf5;color:var(--ink);font-family:inherit;margin-bottom:12px;}
  input:focus{outline:none;border-color:var(--leaf);}
  .btn{display:inline-block;font-family:inherit;font-size:15px;font-weight:700;padding:12px 20px;border-radius:11px;
    border:none;cursor:pointer;background:var(--leaf);color:#fff;transition:background .15s;}
  .btn:hover{background:var(--leaf-dark);} .btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--leaf);border:1.5px solid var(--leaf);}
  .btn.ghost:hover{background:var(--leaf-soft);}
  .btn.sm{font-size:12.5px;padding:7px 12px;border-radius:8px;}
  .note{background:#fdf3e7;border:1px solid #f0d9b5;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5a1a;margin-bottom:14px;}
  .err{color:var(--clay);font-size:13px;font-weight:600;min-height:18px;margin-bottom:8px;}
  .hidden{display:none;}
  .exam-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fbfaf5;}
  .exam-item h3{font-size:16px;color:var(--leaf-dark);margin-bottom:2px;}
  .exam-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .link-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .link-row .ltag{font-size:11px;font-weight:700;color:var(--muted);min-width:68px;}
  .link-row .lval{flex:1;min-width:180px;font-size:12.5px;word-break:break-all;color:var(--leaf-dark);}
  .codes{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .codes b{color:var(--ink);}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .qr-modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(20,35,25,.85);align-items:center;justify-content:center;padding:24px;}
  .qr-modal.show{display:flex;}
  .qr-box{background:#fff;border-radius:16px;padding:26px;text-align:center;max-width:360px;}
  .qr-box h3{font-size:16px;margin-bottom:4px;}
  .qr-box .qsub{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  #qrCanvas{margin:0 auto 16px;}
  .copy{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--leaf);background:#fff;color:var(--leaf-dark);cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="band"><h1>ชุดสอบของฉัน</h1><p>ดูลิงก์ รหัส และ QR code ของทุกชุดสอบที่เคยสร้าง</p></div>

  <section id="loginCard" class="card">
    <h2>เข้าสู่ระบบ</h2>
    <div class="note">ใส่รหัสผ่านรวมเพื่อดูชุดสอบทั้งหมด (รหัสนี้ตั้งไว้ในระบบ ถ้าต้องการเปลี่ยนแจ้งผู้ดูแล)</div>
    <label>รหัสผ่านรวม</label>
    <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="btn" onclick="login()">เข้าสู่ระบบ</button>
  </section>

  <section id="listCard" class="hidden">
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="search" placeholder="ค้นหาชื่อวิชา..." oninput="renderList()" style="margin-bottom:0;flex:1;min-width:160px;">
        <a class="btn ghost sm" id="newExamBtn" href="create.html">+ สร้างชุดสอบใหม่</a>
        <button class="btn ghost sm" onclick="loadList()">รีเฟรช</button>
        <button class="btn ghost sm" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
    <div id="examList"></div>
    <p class="err" id="emptyMsg" style="display:none;text-align:center;">ยังไม่มีชุดสอบที่สร้างไว้</p>
  </section>
</div>

<!-- QR modal -->
<div class="qr-modal" id="qrModal" onclick="if(event.target===this)closeQR()">
  <div class="qr-box">
    <h3 id="qrTitle">QR Code</h3>
    <div class="qsub">ให้นิสิตสแกนด้วยมือถือเพื่อเข้าทำข้อสอบ</div>
    <canvas id="qrCanvas"></canvas>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="btn sm" onclick="downloadQR()">ดาวน์โหลด QR</button>
      <button class="btn ghost sm" onclick="closeQR()">ปิด</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
"use strict";
const FN_URL="https://mxuytburrxeegqjzbfnb.supabase.co/functions/v1/exam-api";
const PUB_KEY="sb_publishable_sFLbri_UHUEhJ71vVEHlsQ_mAAYcGTS";
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"");}
const BASE = location.href.replace(/myexams\.html.*$/,"");

let PW="", exams=[];

async function api(action,payload){
  const res=await fetch(FN_URL,{method:"POST",
    headers:{"Content-Type":"application/json","apikey":PUB_KEY,"Authorization":"Bearer "+PUB_KEY},
    body:JSON.stringify({action,...payload})});
  return {status:res.status, body:await res.json()};
}

async function login(){
  const pw=$("pw").value.trim();
  if(!pw){$("loginErr").textContent="กรุณาใส่รหัสผ่าน";return;}
  $("loginErr").textContent="กำลังเข้าสู่ระบบ...";
  PW=pw;
  const r=await loadList();
  if(r.ok){$("loginErr").textContent="";$("loginCard").classList.add("hidden");$("listCard").classList.remove("hidden");}
  else if(r.reason==="auth"){$("loginErr").textContent="รหัสผ่านไม่ถูกต้อง";}
  else{$("loginErr").textContent="เชื่อมต่อไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่";}
}
function logout(){PW="";exams=[];$("listCard").classList.add("hidden");$("loginCard").classList.remove("hidden");$("pw").value="";}

async function loadList(){
  try{
    const {status,body}=await api("list_exams",{code:PW});
    if(status===401||status===404)return {ok:false,reason:"auth"};
    if(status!==200||!body.ok)return {ok:false,reason:"server"};
    exams=body.exams||[];
    renderList();return {ok:true};
  }catch(e){return {ok:false,reason:"network"};}
}

function renderList(){
  const kw=norm($("search").value);
  let rows=exams.slice();
  if(kw)rows=rows.filter(e=>norm(e.title).includes(kw)||norm(e.subject_code).includes(kw)||norm(e.exam_id).includes(kw));
  const box=$("examList");
  if(rows.length===0){box.innerHTML="";$("emptyMsg").style.display="block";return;}
  $("emptyMsg").style.display="none";
  box.innerHTML=rows.map(e=>{
    const examUrl=BASE+"exam.html?id="+e.exam_id;
    const dashUrl=BASE+"dashboard.html?id="+e.exam_id;
    const dt=e.created_at?new Date(e.created_at).toLocaleDateString("th-TH",{day:"2-digit",month:"short",year:"numeric"}):"";
    return '<div class="exam-item">'+
      '<h3>'+esc(e.title)+'</h3>'+
      '<div class="exam-meta">'+(e.subject_code?esc(e.subject_code)+' · ':'')+'รหัสชุด '+esc(e.exam_id)+' · สร้าง '+esc(dt)+' · ส่งแล้ว '+e.submission_count+' คน</div>'+
      '<div class="link-row"><span class="ltag">ลิงก์นิสิต</span><span class="lval">'+esc(examUrl)+'</span><button class="copy" onclick="copyText(\''+examUrl+'\',this)">คัดลอก</button></div>'+
      '<div class="link-row"><span class="ltag">Dashboard</span><span class="lval">'+esc(dashUrl)+'</span><button class="copy" onclick="copyText(\''+dashUrl+'\',this)">คัดลอก</button></div>'+
      '<div class="codes">รหัสปลดล็อก: <b>'+esc(e.unlock_code)+'</b> &nbsp;|&nbsp; รหัส Dashboard: <b>'+esc(e.dashboard_code)+'</b> &nbsp;|&nbsp; ล็อกเมื่อสลับจอ '+e.max_flags+' ครั้ง</div>'+
      '<div class="actions">'+
        '<button class="btn sm" onclick="showQR(\''+examUrl+'\',\''+esc(e.title).replace(/\'/g,"")+'\')">แสดง QR Code</button>'+
        '<a class="btn ghost sm" href="'+dashUrl+'" target="_blank">เปิด Dashboard</a>'+
      '</div></div>';
  }).join("");
}

function showQR(url,title){
  $("qrTitle").textContent=title||"QR Code";
  // สร้าง QR แล้ววาดลง canvas เอง
  const qr=qrcode(0,"M");          // type 0 = auto, error correction M
  qr.addData(url); qr.make();
  const count=qr.getModuleCount();
  const cell=8, margin=cell*2, size=count*cell+margin*2;
  const cv=$("qrCanvas"); cv.width=size; cv.height=size;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,size,size);
  ctx.fillStyle="#1a2e22";
  for(let r=0;r<count;r++) for(let c=0;c<count;c++){
    if(qr.isDark(r,c)) ctx.fillRect(margin+c*cell, margin+r*cell, cell, cell);
  }
  cv.style.display="block"; cv.style.margin="0 auto 16px"; cv.style.maxWidth="240px"; cv.style.width="240px"; cv.style.height="auto";
  $("qrModal").classList.add("show");
}
function closeQR(){$("qrModal").classList.remove("show");}
function downloadQR(){
  const cv=$("qrCanvas");
  const a=document.createElement("a");
  a.href=cv.toDataURL("image/png");
  a.download="QR_"+($("qrTitle").textContent||"exam")+".png";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function copyText(t,btn){navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent="คัดลอกแล้ว";setTimeout(()=>btn.textContent=o,1500);});}

$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
</script>
</body>
</html>
